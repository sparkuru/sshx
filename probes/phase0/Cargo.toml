[workspace]
members = ["protocol", "harness", "image-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "time", "macros", "sync"] }
russh-sftp = "=3.0.1"
